[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheaf-port"
version = "0.1.0"
description = "Port the Noether dual-loop onto any interconnected domain. Glue only a global section."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Manutej Mulaveesala"}]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
keywords = ["sheaf", "noether", "harness", "morse", "knowledge-base"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sheaf-port = "sheaf_port.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
